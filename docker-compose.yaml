version: "3.8"

services:
  db:
    image: postgres:14
    container_name: fine-engineering-erp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shams@19427
      POSTGRES_DB: postgres
    ports:
      - "5516:5432"
    volumes:
      - fine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: fine-engineering-erp-backend
    restart: always
    ports:
      - "8127:8127"
    environment:
      NODE_ENV: production
      FINE_ENGINEERING_PORT: 8127

      JWT_SECRET: ""

      PGHOST_WRITER: db
      PGPORT_WRITER: 5432
      PGUSER_WRITER: postgres
      PGPASSWORD_WRITER: Shams@19427
      PGDATABASE_WRITER: postgres

      PGHOST_READER: db
      PGPORT_READER: 5432
      PGUSER_READER: postgres
      PGPASSWORD_READER: Shams@19427
      PGDATABASE_READER: postgres

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./config:/usr/src/app/config

volumes:
  fine_pgdata:
